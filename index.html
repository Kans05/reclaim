<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RECLAIM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e100f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e100f;--sf:#13221b;--sf2:#1a2f25;--ln:#244033;--tx:#e8efeb;--mu:#8fa69a;--ac:#34d399;--wr:#e5b567;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f6f4;--sf:#fff;--sf2:#e6f0ea;--ln:#cfe0d6;--tx:#14221b;--mu:#4f6a5c;--ac:#0b8f63;--wr:#a8741c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:13px;letter-spacing:.3em;margin:0;color:var(--ac)}h2{font-size:19px;margin:20px 0 8px}h3{font-size:15px;margin:0 0 6px}
.tag{color:var(--mu);font-size:12px;margin:2px 0 14px}.mut{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:10px 0;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}.ac{color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.k{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.v{font-size:22px;font-weight:600}
button,.btn{background:var(--ac);color:#04130c;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:var(--wr);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 40%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:8px 2px;border-radius:10px}nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:18px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
.sheet{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--sf);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.bar{height:8px;border-radius:6px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--ln);padding:8px 0;font-size:13px}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:14px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ln)}.tl .ok:before{background:var(--ac)}
.badge{display:inline-block;border:1px solid var(--ln);border-radius:20px;padding:4px 10px;margin:3px;font-size:12px;color:var(--mu)}.badge.ok{color:var(--ac);border-color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--sf2);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:20;display:none}
.warn{border-color:var(--wr)}svg{width:100%;height:auto}a{color:var(--ac)}
.orb{width:120px;height:120px;border-radius:50%;margin:16px auto;background:radial-gradient(circle,var(--ac),transparent 70%);animation:br 10s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(.55)}40%{transform:scale(1)}}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--sf2);border:1px solid var(--ln);border-radius:16px;padding:14px;position:relative;opacity:.6}.tile.ok{opacity:1;border-color:var(--ac);background:linear-gradient(160deg,var(--sf2),var(--sf))}.tile.nx{opacity:1}.tile b{font-size:22px;display:block;line-height:1.15}.tile .s{font-size:12px;color:var(--mu)}.tile .c{position:absolute;top:10px;right:12px;color:var(--ac);font-weight:700}.tile .bar{margin-top:10px;height:6px}details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}details>summary::-webkit-details-marker{display:none}
</style></head><body>
<main id="app"></main><div id="toast"></div>
<script>
const K='reclaim.v1';
const defS=()=>({quit:new Date().toISOString(),base:18,price:'',pack:20,cur:'₹',tone:'warm',wake:'07:00',bed:'23:00',screen:'22:00',theme:'dark',name:'',people:'',mine:'',why:'',photo:'',letter:'',mod:{smoke:true,sleep:true,health:true,prog:true},rem:{checkin:'',nrt:'',exercise:'',sleep:'',weekly:''}});
const def=()=>({v:1,ach:{},s:defS(),cr:[],lp:[],nrt:[],hl:{},sl:{},ck:{}});
let memOnly=false;let D=load();D.s.photo='';D.s.letter='';let tab='home',sheet=null,fired={};
function load(){try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);if(o&&o.v===1){const d=def();return {...d,...o,s:{...d.s,...o.s,rem:{...d.s.rem,...(o.s&&o.s.rem)}}}}}}catch(e){memOnly=true}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){memOnly=true;toast('Storage unavailable – changes will not persist. Export a backup.')}}
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ldt=d=>{d=new Date(d);return dk(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmt=t=>new Date(t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const mins=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const hmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const days=n=>Array.from({length:n},(_,i)=>dk(Date.now()-(n-1-i)*864e5));
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

function stats(){const q=new Date(D.s.quit).getTime(),n=Date.now(),started=n>=q;
 const L=D.lp.filter(x=>x.t>=q&&x.t<=n).sort((a,b)=>a.t-b.t),pts=[q,...L.map(x=>x.t),n];
 let best=0;if(started)for(let i=1;i<pts.length;i++)best=Math.max(best,pts[i]-pts[i-1]);
 const cur=started?n-pts[pts.length-2]:0,el=started?n-q:0,lc=sum(L.map(x=>x.n));
 const avoided=Math.max(0,Math.floor(el/864e5*D.s.base-lc)),ld=new Set(L.map(x=>dk(x.t)));
 let sf=0;if(started){const t0=new Date(q);t0.setHours(0,0,0,0);for(let d=new Date(t0);dk(d)<dk(n);d.setDate(d.getDate()+1))if(!ld.has(dk(d)))sf++}
 const p=parseFloat(D.s.price),pk=parseInt(D.s.pack),cpc=p>0&&pk>0?p/pk:null;
 return{q,started,cur,best,el,lc,avoided,sf,money:cpc==null?null:avoided*cpc,lapses:L.length,lastLapse:L.length?L[L.length-1].t:null}}
const CP=[.33,1,2,3,4,6,8,12,16,20,24,30,36,48,60,72,96,120,144,168,192,216,240,288,336,408,504,600,720,1080,1440,2160,2880,4320,6480,8760],MS=CP;
const MN=h=>h<1?'20 minutes':h==1?'1 hour':h<72?h+' hours':h/24+' days';
const MED={.33:'Typically, heart rate begins moving towards normal.',8:'Typically, carbon monoxide levels fall substantially (around 8–12 hours).',48:'Typically, carbon monoxide is generally cleared and taste and smell may improve (around 48–72 hours).',336:'Typically, circulation begins to improve (around 2–12 weeks).',720:'Typically, coughing and shortness of breath often start to decrease (around 1–9 months).',8760:'Typically, cardiovascular risk continues to decline, with longer-term reductions in disease risks (1 year and beyond).'};
const GEN=['Another checkpoint done. Cravings pass and you’re still here.','One more step. This is what progress looks like.','Checkpoint reached. Keep stacking them.'];
function timeline(S,NHS,CDC,WHO){const h=S.cur/36e5,done=CP.filter(x=>h>=x),up=CP.filter(x=>h<x),prev=done.length?done[done.length-1]:0,nx=up[0],row=x=>'<div class="'+(h>=x?'ok':'')+'"><b>'+MN(x)+(h>=x?' ✓':'')+'</b><br><span class="mut">'+(MED[x]||GEN[CP.indexOf(x)%3])+'</span></div>';
 return'<div class="card"><div class="k">'+done.length+' of '+CP.length+' checkpoints reached</div>'+(nx?'<div style="margin:6px 0">Next: <b>'+MN(nx)+'</b> · '+dur(Math.max(0,nx*36e5-S.cur))+' to go</div><div class="bar"><i style="width:'+Math.min(100,(h-prev)/(nx-prev)*100)+'%"></i></div>':'<p>All checkpoints reached.</p>')+'<div class="tl" style="margin-top:14px">'+done.slice(-3).map(row).join('')+up.slice(0,6).map(row).join('')+'</div><p class="mut">Health notes are typical, population-level changes, not guaranteed outcomes or measurements of your own body. Sources: <a href="'+NHS+'" target="_blank" rel="noopener">NHS</a> · <a href="'+CDC+'" target="_blank" rel="noopener">CDC</a> · <a href="'+WHO+'" target="_blank" rel="noopener">WHO</a>. Please check the exact wording there.</p></div>'}
const money=m=>m==null?'Set price':D.s.cur+m.toFixed(0);
function dur(ms){const m=Math.floor(ms/6e4);return Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h '+m%60+'m'}

// sleep
function sleepDur(bed,wake){let d=mins(wake)-mins(bed);if(d<=0)d+=1440;return d}
const sl=()=>Object.entries(D.sl).map(([d,x])=>({d,...x,dur:sleepDur(x.bed,x.wake)})).sort((a,b)=>a.d<b.d?-1:1);
const early=x=>mins(x.wake)<mins(D.s.wake)||mins(x.wake)<420&&mins(D.s.wake)>=420?mins(x.wake)<Math.min(420,mins(D.s.wake)+0):false;
const club=x=>mins(x.wake)<420&&x.dur>=420;
function clubWeek(){const w=new Set(days(7));return sl().filter(x=>w.has(x.d)&&club(x)).length}
function sdev(a){if(a.length<2)return null;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))}
function sleepAdvice(){const r=sl().slice(-7);if(r.length<3)return'Log at least 3 nights to get a gradual adjustment suggestion.';
 const aw=avg(r.map(x=>mins(x.wake))),ab=avg(r.map(x=>{const m=mins(x.bed);return m<720?m+1440:m})),tw=mins(D.s.wake);
 if(aw<=tw)return'Your average wake time ('+hmm(aw)+') is already at or before your target. Keep protecting your sleep duration.';
 const w=Math.max(tw,aw-15);let b=ab-15;if(w+1440-b<450&&w+1440-b>0)b=w+1440-480;
 return'Average so far: bed '+hmm(ab)+', wake '+hmm(aw)+'. Suggested step for this week: bed '+hmm(b)+', wake '+hmm(w)+'. Moving 15 minutes at a time is more sustainable than a sudden jump, and getting 7–9 hours matters more than the exact wake time.'}

// charts
function chart(v,lab,type){const vs=v.filter(x=>x!=null);if(!vs.length)return'<p class="mut">No data recorded yet.</p>';
 const W=320,H=110,P=14,n=v.length;let mn=type=='bar'?0:Math.min(...vs)-1,mx=Math.max(...vs,mn+1);if(type=='bar')mx=Math.max(mx,1);
 const X=i=>P+(n>1?i*(W-2*P)/(n-1):(W-2*P)/2),Y=y=>H-P-(y-mn)/(mx-mn)*(H-2*P);let s='<svg viewBox="0 0 '+W+' '+(H+8)+'">';
 if(type=='bar'){const bw=(W-2*P)/n*.7;v.forEach((y,i)=>{if(y!=null)s+='<rect x="'+(P+i*(W-2*P)/n)+'" y="'+Y(y)+'" width="'+bw+'" height="'+(H-P-Y(y))+'" rx="3" fill="var(--ac)"/>'})}
 else{let pts=v.map((y,i)=>y==null?null:X(i)+','+Y(y)).filter(Boolean);s+='<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="'+pts.join(' ')+'"/>'+pts.map(p=>'<circle r="3" fill="var(--ac)" cx="'+p.split(',')[0]+'" cy="'+p.split(',')[1]+'"/>').join('')}
 s+='<text x="'+P+'" y="'+(H+6)+'" font-size="9" fill="var(--mu)">'+lab[0]+'</text><text x="'+(W-P)+'" y="'+(H+6)+'" font-size="9" text-anchor="end" fill="var(--mu)">'+lab[n-1]+'</text><text x="2" y="10" font-size="9" fill="var(--mu)">'+(+mx.toFixed(1))+'</text></svg>';return s}

// messages
const MSG={1:['You made a decision that your future self will thank you for. Today counts.','Day 1 done. Stay with the plan.'],3:['Three days of choosing differently. The early withdrawal period can be difficult, and you’re working through it.','Three days. The hardest withdrawal window is where you are. Keep going.'],7:['One full week. You have shown yourself that your daily routine can change.','Seven days. Routine changed. Proof.'],14:['Two weeks. Cravings still come, and you’re still choosing your health.','Fourteen days. Consistency is the whole game.'],30:['One month of progress. This is more than a streak; it is a new pattern of living.','Thirty days. It’s a pattern now, not an experiment.'],60:['Two months. Each ordinary day without smoking is quietly adding up.','Sixty days. Keep the systems that got you here.'],90:['Three months. Look at how far you’ve come. Keep protecting your health.','Ninety days. Protect it.'],180:['Half a year. You are no longer just quitting – you are living differently.','Six months. Long-term, not short-term.'],365:['One year. That is a real turning point, and you earned every day of it.','One year. Done well.']};
const POOL=[['Cravings pass whether or not you act on them. You’ve been proving that.','A craving peaks and fades. Ride it out.'],['Every smoke-free day is a day your body gets to recover.','Another day banked.'],['You don’t need to feel motivated today, only to repeat the decision.','Repeat the decision.']];
const ST=[[0,'You’ve started. The first minutes are the hardest to begin, and you did it.'],[.33,'Twenty minutes in. For many people, heart rate starts settling towards normal around now.'],[1,'One hour without smoking. Small, real, and yours.'],[2,'Two hours. Cravings come in waves, and each one you ride out loses some of its power.'],[4,'Four hours in. You are building proof that you can do this.'],[8,'Eight hours. Carbon monoxide levels typically fall substantially around now.'],[12,'Twelve hours. Half a day of choosing yourself.'],[24,'A full day smoke-free. You made a decision your future self will thank you for.'],[36,'A day and a half. The early days can be the hardest, and you’re working through it.'],[48,'Two days. Taste and smell may start to improve for many people.'],[72,'Three days of choosing differently. The early withdrawal period can be difficult, and you’re working through it.']];
const EM=[['Every minute you wait is a minute your body gets to heal. You’re doing something hard on purpose.','Picture who you’re becoming: breathing easier, calmer, in charge of your choices. This hour is part of building them.','A craving is a wave. It rises, peaks and passes, usually within minutes. You can watch it go.','You’re not giving something up. You’re getting your mornings, your breath and your money back.','The people who care about you would be proud. More importantly, you can be.','You don’t have to be perfect. You only have to keep choosing, one hour at a time.','Feeling uncomfortable doesn’t mean something is wrong. It means your body is adjusting.','You have already survived every craving so far. This one is no different.','Your future self is relying on this hour. Hand them something good.','Quitting is a skill, and every hour of practice makes the next one easier.','Be kind to yourself today. Irritable, tired, restless: all common, all temporary.','This is what taking your life back looks like: ordinary, quiet, and entirely yours.'],['Stay with it.','This hour counts.','Cravings pass. Wait it out.','Keep the streak.','One hour at a time.','You’re doing the work.']];
EM[0].push('It’s okay to feel emotional about this. You’re letting go of something that has been with you for years, and that takes courage.','Underneath the craving is someone who wants to feel well. Listen to that voice.','You’re allowed to be proud of yourself right now, even if no one else sees how hard today is.','Tough moments don’t mean you’re failing. They mean you’re doing something that matters.','Imagine yourself a year from now, glad you stuck with it. That person is cheering for you.','You’re choosing to be around, healthy, for the people and moments you love.','Calm is coming. Each smoke-free hour teaches your mind it can feel steady without a cigarette.','Rest if you need to. Healing is quiet work, and you’re doing it.');
const MO=[['Win this hour. Then the next one. That’s the whole strategy.','Move: a short walk, some push-ups, a stretch. Action beats a craving.','You’ve done the hardest part, which was starting. Now protect the streak.','Drink water, breathe, wait ten minutes, then decide. You’ll rarely still want it.','Every craving you beat makes the next one weaker.','Strong isn’t never craving. Strong is craving and choosing anyway.','Stack a win: log this craving, then do one healthy thing.','Your gym sessions and your smoke-free streak build each other. Do both today.','Think of the money piling up. It’s real, and it’s yours.','Today’s goal is small: stay smoke-free until you sleep tonight.','You’re training a new default. Repetition is how it sticks.','Change the scene: leave the room, get outside, give your hands something else to do.','You’ve already proved you can go this long. Add one more hour.','Plan for your trigger before it arrives: coffee, meals, stress. Have your swap ready.','Discipline now buys freedom later.','Protect your streak like something valuable, because it is.','One decision, repeated: no cigarette. That’s all this is.','Reward yourself today with something that isn’t smoke.','Better sleep, steadier mood, easier breathing: they all grow from days like this one.','You’re not starting over. You’re continuing what you began.'],['Delay ten minutes.','Move your body.','No cigarette. Next hour.','Drink water. Breathe.','Hold the line.','Log it and keep going.']];
function message(){const S=stats(),t=D.s.tone=='warm'?0:1,n=Date.now();
 if(!S.started)return'Your quit date is set for '+fmt(S.q)+'. Until then, you can start logging sleep and health.';
 if(S.lastLapse&&n-S.lastLapse<864e5)return t?'A lapse is data, not failure. Your progress is intact. Resume now.':'A lapse doesn’t erase your progress. Everything you’ve built still counts. What matters is the next choice, and you can make it right now.';
 const h=S.cur/36e5;let out;
 if(h<72){let st=ST[0];ST.forEach(x=>{if(h>=x[0])st=x});out=st[1]}
 else{const d=Math.floor(h/24);out=MSG[d]?MSG[d][t]:POOL[d%POOL.length][t]}
 const fh=Math.floor(h)+SEED,sec=PERS[fh%PERS.length],extra=[];
 const al=achLine(fh);if(al)extra.push(al);
 if(S.avoided>0&&fh%3==0)extra.push('So far: '+S.avoided+' cigarettes not smoked'+(S.money!=null?', '+money(S.money)+' saved':'')+'.');
 const nc=D.cr.filter(c=>!c.smoked&&dk(c.t)==dk(n)).length;
 if(nc)extra.push(nc+' craving'+(nc>1?'s':'')+' handled without smoking today.');
 if(clubWeek()>=3)extra.push('You’ve woken before 7:00 with a full night’s sleep '+clubWeek()+' times this week.');
 return fill(out+' '+sec+(extra.length?' '+extra.join(' '):''))}

// achievements
function achv(){const S=stats(),M=D.s.mod,A=[],h=S.best/36e5,cu=D.s.cur,
 add=(c,n,big,sub,cur,tgt,rem)=>A.push({c,n,big,sub,cur:cur||0,tgt,rem,ok:!!D.ach[n]||(cur||0)>=tgt}),rs=D.cr.filter(c=>!c.smoked).length;
 if(M.smoke){CP.forEach(x=>{if(x>=1)add('time','Smoke-free '+MN(x),MN(x),'smoke-free',h,x,r=>dur(r*36e5)+' to go')});
  [1,3,5,10,25,50,100,200].forEach(x=>add('crav',x+(x==1?' craving beaten':' cravings beaten'),''+x,x==1?'craving beaten':'cravings beaten',rs,x));
  [10,25,50,100,250,500,1000].forEach(x=>add('cig',x+' cigarettes avoided',''+x,'cigarettes avoided',S.avoided,x));
  if(S.money!=null)[100,500,1000,2500,5000,10000].forEach(x=>add('money',cu+x+' saved',cu+x,'saved',S.money,x,r=>cu+Math.ceil(r)+' to go'))}
 if(M.health){const ex=Object.values(D.hl).filter(x=>x.exT&&x.exT!='none'),gym=ex.filter(x=>x.exT=='gym').length,tr=Object.keys(D.hl).length;
  [1,3,5,10,20,40].forEach(x=>add('act',x+(x==1?' active day':' active days'),''+x,x==1?'active day':'active days',ex.length,x));
  [1,5,12,25].forEach(x=>add('gym',x+(x==1?' gym session':' gym sessions'),''+x,x==1?'gym session':'gym sessions',gym,x));
  [1,7,14,30].forEach(x=>add('trk',x+(x==1?' day':' days')+' of health tracking',''+x,x==1?'day tracked':'days tracked',tr,x))}
 if(M.sleep){const r=sl(),sd=sdev(r.slice(-7).map(x=>mins(x.wake))),cd=r.filter(club).length;
  [1,7,14,30].forEach(x=>add('sl',x+(x==1?' night':' nights')+' of sleep logged',''+x,x==1?'night logged':'nights logged',r.length,x));
  [1,3,5,10,20].forEach(x=>add('club','7 AM Club: '+x+(x==1?' early day':' early days')+' (up before 7:00, 7+ hours)',''+x,x==1?'early day · up before 7:00 with 7+ hours':'early days · up before 7:00 with 7+ hours',cd,x));
  add('club2','Sleep consistency: 7 nights within about 30 minutes','7 nights','steady wake time',r.length>=7&&sd<=30?1:0,1,()=>'Log 7 nights, wake within ~30 min')}
 return A}
function checkAch(){const A=achv().filter(x=>x.ok&&!D.ach[x.n]);if(!A.length)return;const silent=!Object.keys(D.ach).length&&A.length>3;A.forEach(x=>D.ach[x.n]=Date.now());save();if(!silent)toast(A.length==1?'Achievement: '+A[0].n:A.length+' new achievements. See Progress.')}
