<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RECLAIM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e100f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e100f;--sf:#13221b;--sf2:#1a2f25;--ln:#244033;--tx:#e8efeb;--mu:#8fa69a;--ac:#34d399;--wr:#e5b567;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f6f4;--sf:#fff;--sf2:#e6f0ea;--ln:#cfe0d6;--tx:#14221b;--mu:#4f6a5c;--ac:#0b8f63;--wr:#a8741c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:13px;letter-spacing:.3em;margin:0;color:var(--ac)}h2{font-size:19px;margin:20px 0 8px}h3{font-size:15px;margin:0 0 6px}
.tag{color:var(--mu);font-size:12px;margin:2px 0 14px}.mut{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:10px 0;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}.ac{color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.k{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.v{font-size:22px;font-weight:600}
button,.btn{background:var(--ac);color:#04130c;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:var(--wr);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:8px 2px;border-radius:10px}nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:18px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
.sheet{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--sf);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.bar{height:8px;border-radius:6px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--ln);padding:8px 0;font-size:13px}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:14px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ln)}.tl .ok:before{background:var(--ac)}
.badge{display:inline-block;border:1px solid var(--ln);border-radius:20px;padding:4px 10px;margin:3px;font-size:12px;color:var(--mu)}.badge.ok{color:var(--ac);border-color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--sf2);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:20;display:none}
.warn{border-color:var(--wr)}svg{width:100%;height:auto}a{color:var(--ac)}
</style></head><body>
<main id="app"></main><div id="toast"></div>
<script>
const K='reclaim.v1';
const defS=()=>({quit:new Date().toISOString(),base:18,price:'',pack:20,cur:'₹',tone:'warm',wake:'07:00',bed:'23:00',screen:'22:00',theme:'dark',rem:{checkin:'',nrt:'',exercise:'',sleep:'',weekly:''}});
const def=()=>({v:1,s:defS(),cr:[],lp:[],nrt:[],hl:{},sl:{},ck:{}});
let D=load(),tab='home',sheet=null,memOnly=false,fired={};
function load(){try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);if(o&&o.v===1){const d=def();return {...d,...o,s:{...d.s,...o.s,rem:{...d.s.rem,...(o.s&&o.s.rem)}}}}}}catch(e){memOnly=true}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){memOnly=true;toast('Storage unavailable – changes will not persist. Export a backup.')}}
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ldt=d=>{d=new Date(d);return dk(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmt=t=>new Date(t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const mins=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const hmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const days=n=>Array.from({length:n},(_,i)=>dk(Date.now()-(n-1-i)*864e5));
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

function stats(){const q=new Date(D.s.quit).getTime(),n=Date.now(),started=n>=q;
 const L=D.lp.filter(x=>x.t>=q&&x.t<=n).sort((a,b)=>a.t-b.t),pts=[q,...L.map(x=>x.t),n];
 let best=0;if(started)for(let i=1;i<pts.length;i++)best=Math.max(best,pts[i]-pts[i-1]);
 const cur=started?n-pts[pts.length-2]:0,el=started?n-q:0,lc=sum(L.map(x=>x.n));
 const avoided=Math.max(0,Math.floor(el/864e5*D.s.base-lc)),ld=new Set(L.map(x=>dk(x.t)));
 let sf=0;if(started){const t0=new Date(q);t0.setHours(0,0,0,0);for(let d=new Date(t0);dk(d)<dk(n);d.setDate(d.getDate()+1))if(!ld.has(dk(d)))sf++}
 const p=parseFloat(D.s.price),pk=parseInt(D.s.pack),cpc=p>0&&pk>0?p/pk:null;
 return{q,started,cur,best,el,lc,avoided,sf,money:cpc==null?null:avoided*cpc,lapses:L.length,lastLapse:L.length?L[L.length-1].t:null}}
const MS=[24,72,168,336,720,1440,2160,4320,8760];
const MN=h=>h<48?'First 24 hours':h/24+' days';
const money=m=>m==null?'Set price':D.s.cur+m.toFixed(0);
function dur(ms){const m=Math.floor(ms/6e4);return Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h '+m%60+'m'}

// sleep
function sleepDur(bed,wake){let d=mins(wake)-mins(bed);if(d<=0)d+=1440;return d}
const sl=()=>Object.entries(D.sl).map(([d,x])=>({d,...x,dur:sleepDur(x.bed,x.wake)})).sort((a,b)=>a.d<b.d?-1:1);
const early=x=>mins(x.wake)<mins(D.s.wake)||mins(x.wake)<420&&mins(D.s.wake)>=420?mins(x.wake)<Math.min(420,mins(D.s.wake)+0):false;
const club=x=>mins(x.wake)<420&&x.dur>=420;
function clubWeek(){const w=new Set(days(7));return sl().filter(x=>w.has(x.d)&&club(x)).length}
function sdev(a){if(a.length<2)return null;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))}
function sleepAdvice(){const r=sl().slice(-7);if(r.length<3)return'Log at least 3 nights to get a gradual adjustment suggestion.';
 const aw=avg(r.map(x=>mins(x.wake))),ab=avg(r.map(x=>{const m=mins(x.bed);return m<720?m+1440:m})),tw=mins(D.s.wake);
 if(aw<=tw)return'Your average wake time ('+hmm(aw)+') is already at or before your target. Keep protecting your sleep duration.';
 const w=Math.max(tw,aw-15);let b=ab-15;if(w+1440-b<450&&w+1440-b>0)b=w+1440-480;
 return'Average so far: bed '+hmm(ab)+', wake '+hmm(aw)+'. Suggested step for this week: bed '+hmm(b)+', wake '+hmm(w)+'. Moving 15 minutes at a time is more sustainable than a sudden jump, and getting 7–9 hours matters more than the exact wake time.'}

// charts
function chart(v,lab,type){const vs=v.filter(x=>x!=null);if(!vs.length)return'<p class="mut">No data recorded yet.</p>';
 const W=320,H=110,P=14,n=v.length;let mn=type=='bar'?0:Math.min(...vs)-1,mx=Math.max(...vs,mn+1);if(type=='bar')mx=Math.max(mx,1);
 const X=i=>P+(n>1?i*(W-2*P)/(n-1):(W-2*P)/2),Y=y=>H-P-(y-mn)/(mx-mn)*(H-2*P);let s='<svg viewBox="0 0 '+W+' '+(H+8)+'">';
 if(type=='bar'){const bw=(W-2*P)/n*.7;v.forEach((y,i)=>{if(y!=null)s+='<rect x="'+(P+i*(W-2*P)/n)+'" y="'+Y(y)+'" width="'+bw+'" height="'+(H-P-Y(y))+'" rx="3" fill="var(--ac)"/>'})}
 else{let pts=v.map((y,i)=>y==null?null:X(i)+','+Y(y)).filter(Boolean);s+='<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="'+pts.join(' ')+'"/>'+pts.map(p=>'<circle r="3" fill="var(--ac)" cx="'+p.split(',')[0]+'" cy="'+p.split(',')[1]+'"/>').join('')}
 s+='<text x="'+P+'" y="'+(H+6)+'" font-size="9" fill="var(--mu)">'+lab[0]+'</text><text x="'+(W-P)+'" y="'+(H+6)+'" font-size="9" text-anchor="end" fill="var(--mu)">'+lab[n-1]+'</text><text x="2" y="10" font-size="9" fill="var(--mu)">'+(+mx.toFixed(1))+'</text></svg>';return s}

// messages
const MSG={1:['You made a decision that your future self will thank you for. Today counts.','Day 1 done. Stay with the plan.'],3:['Three days of choosing differently. The early withdrawal period can be difficult, and you’re working through it.','Three days. The hardest withdrawal window is where you are. Keep going.'],7:['One full week. You have shown yourself that your daily routine can change.','Seven days. Routine changed. Proof.'],14:['Two weeks. Cravings still come, and you’re still choosing your health.','Fourteen days. Consistency is the whole game.'],30:['One month of progress. This is more than a streak; it is a new pattern of living.','Thirty days. It’s a pattern now, not an experiment.'],60:['Two months. Each ordinary day without smoking is quietly adding up.','Sixty days. Keep the systems that got you here.'],90:['Three months. Look at how far you’ve come. Keep protecting your health.','Ninety days. Protect it.'],180:['Half a year. You are no longer just quitting – you are living differently.','Six months. Long-term, not short-term.'],365:['One year. That is a real turning point, and you earned every day of it.','One year. Done well.']};
const POOL=[['Cravings pass whether or not you act on them. You’ve been proving that.','A craving peaks and fades. Ride it out.'],['Every smoke-free day is a day your body gets to recover.','Another day banked.'],['You don’t need to feel motivated today, only to repeat the decision.','Repeat the decision.']];
function message(){const S=stats(),t=D.s.tone=='direct'?1:0,n=Date.now();
 if(!S.started)return'Your quit date is set for '+fmt(S.q)+'. Until then, you can start logging sleep and health.';
 if(S.lastLapse&&n-S.lastLapse<864e5)return t?'A lapse is data, not failure. Your progress is intact. Resume now.':'A lapse doesn’t erase your progress. Everything you’ve built still counts. What matters is the next choice, and you can make it right now.';
 const d=Math.floor(S.cur/864e5)+(S.cur>=36e5*24?0:0);let out;const ks=Object.keys(MSG).map(Number).filter(k=>k<=d);
 if(d===0&&S.cur>0)out=MSG[1][t];else if(MSG[d])out=MSG[d][t];else out=POOL[d%POOL.length][t];
 const rs=sl().slice(-7),extra=[];const nc=D.cr.filter(c=>!c.smoked&&dk(c.t)==dk(n)).length;
 if(nc)extra.push(nc+' craving'+(nc>1?'s':'')+' handled without smoking today.');
 if(clubWeek()>=3)extra.push('You’ve woken before 7:00 with a full night’s sleep '+clubWeek()+' times this week.');
 return out+(extra.length?' '+extra.join(' '):'')}

// achievements
function achv(){const S=stats(),h=S.best/36e5,A=[];
 [[24,'First 24 hours'],[72,'3 days'],[168,'7 days'],[336,'14 days'],[720,'30 days'],[1440,'60 days'],[2160,'90 days'],[4320,'180 days'],[8760,'365 days']].forEach(([x,n])=>A.push({n,ok:h>=x}));
 const resisted=D.cr.filter(c=>!c.smoked).length;A.push({n:'10 cravings resisted',ok:resisted>=10},{n:'50 cravings resisted',ok:resisted>=50});
 const ex=Object.entries(D.hl).filter(([d,x])=>x.exT&&x.exT!='none'),w=new Set(days(7));
 A.push({n:'First week of exercise (4+ active days in 7)',ok:ex.filter(([d])=>w.has(d)).length>=4||hasWeek(ex.map(e=>e[0]))});
 const gym=ex.filter(([d,x])=>x.exT=='gym').length;A.push({n:'Gym consistency (12 sessions)',ok:gym>=12});
 const hd=Object.keys(D.hl).sort();A.push({n:'First month of health tracking',ok:hd.length>=20&&hd.length>0&&(new Date(hd[hd.length-1])-new Date(hd[0]))/864e5>=29});
 const r=sl().slice(-7),sd=sdev(r.map(x=>mins(x.wake)));A.push({n:'Sleep consistency (7 nights, wake time within ~30 min)',ok:r.length>=7&&sd<=30});
 A.push({n:'7 AM Club (5 of 7 days: up before 7:00 with 7+ hours’ sleep)',ok:clubWeek()>=5,club:1});return A}
function hasWeek(ds){const s=new Set(ds);for(let i=0;i<=Object.keys(s).length+60;i++){let c=0;for(let j=0;j<7;j++)if(s.has(dk(Date.now()-(i+j)*864e5)))c++;if(c>=4)return true}return false}

// views
const card=(h)=>'<div class="card">'+h+'</div>';
function home(){const S=stats(),n=MS.find(x=>x*36e5>S.cur),td=dk(Date.now());
 const chk=[!D.lp.some(x=>dk(x.t)==td)&&S.started,!!D.sl[td],!!D.hl[td],D.hl[td]&&D.hl[td].exT&&D.hl[td].exT!='none'];const sc=chk.filter(Boolean).length;
 const pc=n?Math.min(100,S.cur/(n*36e5)*100):100;
 const cr=D.cr.length,nr=sum(D.nrt.filter(x=>dk(x.t)==td).map(x=>x.n));
 return'<h1>RECLAIM</h1><div class="tag">Take back your health. Take back your life.</div>'+
 card('<div class="k">Smoke-free streak</div><div class="big ac">'+(S.started?Math.floor(S.cur/864e5):0)+'<span style="font-size:18px"> days</span></div><div class="mut">'+(S.started?dur(S.cur)+' since '+(S.lapses?'your last lapse':'quitting'):'Starts '+fmt(S.q))+'</div>')+
 card('<p style="margin:0">'+esc(message())+'</p>')+
 '<div class="grid"><div class="card"><div class="k">Cigarettes avoided</div><div class="v">'+S.avoided+'</div></div><div class="card"><div class="k">Money saved</div><div class="v">'+money(S.money)+'</div></div><div class="card"><div class="k">Cravings logged</div><div class="v">'+cr+'</div></div><div class="card"><div class="k">Gum today</div><div class="v">'+nr+' pcs</div></div></div>'+
 card('<div class="k">Next milestone</div><div style="margin:4px 0 8px">'+(n?MN(n)+' · '+dur(Math.max(0,n*36e5-S.cur))+' to go':'All milestones reached')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>')+
 card('<div class="k">Today’s check-in</div><div style="margin:4px 0 8px">'+sc+' of 4 · smoke-free, sleep logged, health logged, active</div><div class="bar"><i style="width:'+sc*25+'%"></i></div>')+
 '<div class="row"><button data-a="sheet:craving">Log craving</button><button data-a="sheet:nrt" class="g">Log gum</button></div><div class="row" style="margin-top:8px"><button data-a="sheet:hlog" class="g">Log health</button><button data-a="sheet:slog" class="g">Log sleep</button></div>'+
 '<div class="card" style="margin-top:14px"><div class="k">7 AM Club</div><div style="margin:4px 0">'+clubWeek()+' of 5 days this week</div><div class="mut">Counts only when you got up before 7:00 <b>and</b> slept 7+ hours.</div></div>'}

function journey(){const S=stats(),c=D.cr;const tr={},hr={};c.forEach(x=>{tr[x.trig]=(tr[x.trig]||0)+1;const b=['00–06','06–12','12–18','18–24'][Math.floor(new Date(x.t).getHours()/6)];hr[b]=(hr[b]||0)+1});
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="li"><span>'+esc(k)+'</span><b>'+v+'</b></div>').join('')||'<p class="mut">Log cravings to see patterns.</p>';
 const ok=c.length?Math.round(c.filter(x=>!x.smoked).length/c.length*100)+'%':'–';
 const TL=[[.33,'~20 minutes','Heart rate begins to move towards normal.'],[10,'~8–12 hours','Carbon monoxide levels fall substantially.'],[60,'~48–72 hours','Carbon monoxide is generally cleared; taste and smell may improve.'],[336,'~2–12 weeks','Circulation improves.'],[720,'~1–9 months','Coughing and shortness of breath often decrease.'],[8760,'~1 year and beyond','Cardiovascular risk continues to decline, with longer-term reductions in disease risk.']];
 const NHS='https://www.nhs.uk/better-health/quit-smoking/',CDC='https://www.cdc.gov/tobacco/about/benefits-of-quitting.html',WHO='https://www.who.int/news-room/fact-sheets/detail/tobacco';
 return'<h2>Quit journey</h2><div class="grid"><div class="card"><div class="k">Best streak</div><div class="v">'+dur(S.best)+'</div></div><div class="card"><div class="k">Smoke-free days</div><div class="v">'+S.sf+'</div></div><div class="card"><div class="k">Lapses logged</div><div class="v">'+S.lapses+'</div></div><div class="card"><div class="k">Craving success</div><div class="v">'+ok+'</div></div></div>'+
 '<div class="row" style="margin-top:10px"><button data-a="sheet:craving">Log craving</button><button class="g" data-a="sheet:lapse">Record a lapse</button></div>'+
 card('<h3>Top triggers</h3>'+top(tr))+card('<h3>Strongest craving periods</h3>'+top(hr)+'<h3 style="margin-top:12px">Cravings per day (14 days)</h3>'+chart(days(14).map(d=>c.filter(x=>dk(x.t)==d).length),['14d ago','today'],'bar'))+
 card('<h3>Nicotine gum</h3><p class="mut">This is a logging tool, not dosing advice. Confirm strength (2 mg vs 4 mg) and schedule using the product leaflet and a pharmacist or doctor; don’t exceed the instructions.</p><p><b>Chew and park:</b> chew slowly until the taste turns peppery or you feel a tingle, park it between cheek and gum, and when the tingle fades chew again. Repeat for about 30 minutes. Avoid acidic drinks (coffee, juice) 15 minutes before and during.</p><button data-a="sheet:nrt">Log gum</button>'+hist(D.nrt.map((x,i)=>[x.t,x.prod+' '+x.str+' × '+x.n+(x.note?' · '+esc(x.note):''),'nrt',i])))+
 card('<h3>Craving &amp; lapse history</h3>'+hist([...c.map((x,i)=>[x.t,'Craving '+x.int+'/10 · '+esc(x.trig)+(x.smoked?' · smoked':' · resisted')+(x.did?' · '+esc(x.did):''),'cr',i]),...D.lp.map((x,i)=>[x.t,'Lapse · '+x.n+' cigarette(s)'+(x.note?' · '+esc(x.note):''),'lp',i])]))+
 '<h2>Recovery timeline</h2><div class="card"><div class="tl">'+TL.map(([h,t,m])=>'<div class="'+(S.cur/36e5>=h?'ok':'')+'"><b>'+t+'</b><br><span class="mut">'+m+'</span></div>').join('')+'</div><p class="mut">These are typical, population-level changes, not guaranteed individual outcomes or measurements of your own body. Sources: <a href="'+NHS+'" target="_blank" rel="noopener">NHS</a> · <a href="'+CDC+'" target="_blank" rel="noopener">CDC</a> · <a href="'+WHO+'" target="_blank" rel="noopener">WHO</a>. Please check the exact wording there.</p></div>'}
function hist(a){a.sort((x,y)=>y[0]-x[0]);return a.length?a.slice(0,15).map(x=>'<div class="li"><span>'+fmt(x[0])+' · '+x[1]+'</span><button class="d" data-a="del:'+x[2]+':'+x[3]+'">Delete</button></div>').join(''):'<p class="mut">Nothing logged yet.</p>'}

function health(){const H=days(14),hd=D.hl,S=sl(),r=S.slice(-7),td=dk(Date.now());
 const aw=avg(r.map(x=>mins(x.wake))),ab=avg(r.map(x=>{const m=mins(x.bed);return m<720?m+1440:m})),sw=sdev(r.map(x=>mins(x.wake)));
 const cl=D.ck[td]||[],CL=['Screens off at cut-off','Lights dimmed','No caffeine late','Clothes / bag ready','Alarm set'];
 return'<h2>Health</h2><div class="row"><button data-a="sheet:hlog">Log today</button><button class="g" data-a="sheet:slog">Log sleep</button></div>'+
 card('<h3>Weight (14 days)</h3>'+chart(H.map(d=>hd[d]&&hd[d].w||null),['14d ago','today'],'line'))+
 card('<h3>Sleep duration, hours</h3>'+chart(H.map(d=>D.sl[d]?+(sleepDur(D.sl[d].bed,D.sl[d].wake)/60).toFixed(1):null),['14d ago','today'],'bar')+
 '<div class="grid" style="margin-top:10px"><div><div class="k">Avg bedtime</div><b>'+(ab!=null?hmm(ab):'–')+'</b></div><div><div class="k">Avg wake</div><b>'+(aw!=null?hmm(aw):'–')+'</b></div><div><div class="k">Wake consistency</div><b>'+(sw!=null?'±'+Math.round(sw)+' min':'–')+'</b></div><div><div class="k">Up before 7:00 (7 nights)</div><b>'+r.filter(x=>mins(x.wake)<420).length+'/'+r.length+'</b></div></div>')+
 card('<h3>Gradual adjustment</h3><p class="mut" style="margin:0">'+sleepAdvice()+'</p><p class="mut">Target: wake '+D.s.wake+' · bed '+D.s.bed+' · screens off '+D.s.screen+' (change in Settings). Aim for 7–9 hours.</p>')+
 card('<h3>Evening checklist</h3>'+CL.map((x,i)=>'<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" style="width:auto" data-a="ck:'+i+'" '+(cl.includes(i)?'checked':'')+'>'+x+'</label>').join(''))+
 card('<h3>Exercise (14 days)</h3>'+chart(H.map(d=>hd[d]&&hd[d].exM?+hd[d].exM:null),['14d ago','today'],'bar'))+
 card('<h3>Energy (1–10)</h3>'+chart(H.map(d=>hd[d]&&hd[d].en||null),['14d ago','today'],'line')+'<p class="mut">Breathing comfort is a subjective rating and does not measure lung recovery.</p>')}

function summary(n){const ds=new Set(days(n)),inR=t=>ds.has(dk(t)),c=D.cr.filter(x=>inR(x.t)),s=sl().filter(x=>ds.has(x.d)),h=Object.entries(D.hl).filter(([d])=>ds.has(d));
 return{cr:c.length,res:c.filter(x=>!x.smoked).length,lp:D.lp.filter(x=>inR(x.t)).length,gum:sum(D.nrt.filter(x=>inR(x.t)).map(x=>x.n)),sl:s.length?(avg(s.map(x=>x.dur))/60).toFixed(1)+' h':'–',early:s.filter(x=>mins(x.wake)<420).length+'/'+s.length,act:h.filter(([d,x])=>x.exT&&x.exT!='none').length}}
function progress(){const a=summary(7),b=summary(30),A=achv();
 const row=(l,k)=>'<div class="li"><span>'+l+'</span><span>'+a[k]+' <span class="mut">/ '+b[k]+'</span></span></div>';
 return'<h2>Progress</h2>'+card('<div class="li" style="border:0"><b>Last 7 days / 30 days</b></div>'+row('Cravings','cr')+row('Resisted','res')+row('Lapses','lp')+row('Gum pieces','gum')+row('Avg sleep','sl')+row('Up before 7:00','early')+row('Active days','act'))+
 card('<h3>Money saved</h3><div class="v">'+money(stats().money)+'</div><p class="mut">Based on your pack price and cigarettes avoided.</p>')+
 card('<h3>Nicotine gum per day (14 days)</h3>'+chart(days(14).map(d=>sum(D.nrt.filter(x=>dk(x.t)==d).map(x=>x.n))),['14d ago','today'],'bar'))+
 '<h2>Achievements</h2><div class="card">'+A.map(x=>'<span class="badge '+(x.ok?'ok':'')+'">'+(x.ok?'✓ ':'')+x.n+'</span>').join('')+'<p class="mut">Awarded only from data you have logged.</p></div><button data-a="report" class="g" style="width:100%">Download text report</button>'}

function settings(){const s=D.s,i=(k,l,t,x='')=>'<label>'+l+'</label><input data-s="'+k+'" type="'+t+'" value="'+esc(s[k])+'" '+x+'>';
 return'<h2>Settings</h2><div class="card"><label>Quit date &amp; time</label><input data-s="quit" type="datetime-local" value="'+ldt(s.quit)+'">'+i('base','Daily cigarette baseline','number','min=1 max=100')+i('price','Pack price (leave empty if unknown)','number','min=0 step=0.01')+i('pack','Cigarettes per pack','number','min=1')+i('cur','Currency symbol','text','maxlength=4')+
 '<label>Motivation tone</label><select data-s="tone"><option value="warm" '+(s.tone=='warm'?'selected':'')+'>Warm</option><option value="direct" '+(s.tone=='direct'?'selected':'')+'>Direct</option></select><label>Theme</label><select data-s="theme"><option value="dark" '+(s.theme=='dark'?'selected':'')+'>Dark</option><option value="light" '+(s.theme=='light'?'selected':'')+'>Light</option></select></div>'+
 '<div class="card"><h3>Sleep targets</h3>'+i('wake','Wake-up target','time')+i('bed','Bedtime target','time')+i('screen','Screen cut-off','time')+'</div>'+
 '<div class="card"><h3>Reminders</h3><p class="mut">Reminders only fire while RECLAIM is open in a browser tab or app window; a plain web app cannot reliably notify you when closed. Treat them as a nudge, and also set a phone alarm for the important ones.</p>'+[['checkin','Daily check-in'],['nrt','Log nicotine gum'],['exercise','Exercise'],['sleep','Sleep routine / bedtime'],['weekly','Weekly review (Sundays)']].map(([k,l])=>'<label>'+l+'</label><input type="time" data-r="'+k+'" value="'+s.rem[k]+'">').join('')+'<button class="g" style="margin-top:10px" data-a="notif">Enable notifications</button></div>'+
 '<div class="card"><h3>Your data</h3><p class="mut">Stored only on this device. '+(memOnly?'<b>Storage is unavailable here, so export backups.</b>':'')+'</p><div class="row"><button data-a="export">Export JSON</button><button class="g" data-a="import">Import JSON</button></div><button class="d" data-a="wipe" style="margin-top:8px">Delete all data…</button><input type="file" id="imp" accept=".json,application/json" hidden></div>'+
 '<p class="mut">RECLAIM is a self-tracking tool, not medical advice. For withdrawal, nicotine replacement dosing, or health concerns, speak with a doctor or pharmacist.</p>'}

const TR=['After meals','Coffee or tea','Work breaks','Stress','Boredom','Driving','Social situations','Immediately after waking','Other'];
function sheetHTML(t){const now=ldt(Date.now()),F=(n,l,ty,x='')=>'<label>'+l+'</label><input name="'+n+'" type="'+ty+'" '+x+'>',O=a=>a.map(x=>'<option>'+x+'</option>').join('');
 const B='<div class="row" style="margin-top:14px"><button type="button" class="g" data-a="close">Cancel</button><button>Save</button></div></form>';
 if(t=='craving')return'<h3>Log craving</h3><form data-f="craving">'+F('t','Time','datetime-local','required value="'+now+'"')+F('int','Intensity (1–10)','number','required min=1 max=10 value=5')+'<label>Trigger</label><select name="trig">'+O(TR)+'</select>'+F('did','What did you do?','text','maxlength=120')+'<label>Did you smoke?</label><select name="smoked"><option value="0">No</option><option value="1">Yes</option></select><label>Notes</label><textarea name="note" rows=2 maxlength=300></textarea>'+B;
 if(t=='lapse')return'<h3>Record a lapse</h3><p class="mut">A lapse is information, not failure. Your history and total progress are kept.</p><form data-f="lapse">'+F('t','When','datetime-local','required value="'+now+'"')+F('n','Cigarettes smoked','number','required min=1 max=60 value=1')+F('note','What led to it?','text','maxlength=200')+B;
 if(t=='nrt')return'<h3>Log nicotine gum</h3><p class="mut">Logging only. Follow the product leaflet and professional advice.</p><form data-f="nrt">'+F('t','Time','datetime-local','required value="'+now+'"')+F('prod','Product','text','required value="Nicotex" maxlength=40')+'<label>Strength</label><select name="str"><option>2 mg</option><option>4 mg</option><option>Other</option></select>'+F('n','Pieces','number','required min=1 max=30 value=1')+F('note','Notes','text','maxlength=200')+B;
 if(t=='hlog'){const x=D.hl[dk(Date.now())]||{};return'<h3>Health log · today</h3><form data-f="hlog">'+F('w','Weight (kg)','number','min=20 max=300 step=0.1 value="'+(x.w||'')+'"')+F('water','Water (glasses)','number','min=0 max=40 value="'+(x.water||'')+'"')+F('en','Energy (1–10)','number','min=1 max=10 value="'+(x.en||'')+'"')+F('br','Breathing comfort (1–10, subjective)','number','min=1 max=10 value="'+(x.br||'')+'"')+'<label>Exercise</label><select name="exT">'+['none','gym','cardio','walking','other'].map(o=>'<option '+(x.exT==o?'selected':'')+'>'+o+'</option>').join('')+'</select>'+F('exM','Minutes','number','min=0 max=600 value="'+(x.exM||'')+'"')+F('nut','Nutrition notes','text','maxlength=200 value="'+esc(x.nut||'')+'"')+B}
 if(t=='slog'){const x=D.sl[dk(Date.now())]||{};return'<h3>Sleep · night ending today</h3><form data-f="slog">'+F('bed','Bedtime (actual)','time','required value="'+(x.bed||D.s.bed)+'"')+F('wake','Wake-up (actual)','time','required value="'+(x.wake||'')+'"')+'<label>Sleep quality (1–5)</label><input name="q" type="number" min=1 max=5 value="'+(x.q||3)+'"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="up" style="width:auto" '+(x.up?'checked':'')+'>Got out of bed on time</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="mex" style="width:auto" '+(x.mex?'checked':'')+'>Morning exercise / gym</label>'+B}}

function render(){document.documentElement.dataset.theme=D.s.theme;const V={home,journey,health,progress,settings}[tab]();
 $('#app').innerHTML=V+'<nav>'+[['home','⌂','Home'],['journey','◔','Quit Journey'],['health','♡','Health'],['progress','▤','Progress'],['settings','⚙','Settings']].map(([k,i,l])=>'<button data-a="tab:'+k+'" class="'+(tab==k?'on':'')+'"><i>'+i+'</i>'+l+'</button>').join('')+'</nav>'+(sheet?'<div class="sheet"><div>'+sheetHTML(sheet)+'</div></div>':'')}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function report(){const a=summary(7),b=summary(30),S=stats();return'RECLAIM report · '+new Date().toLocaleString()+'\nStreak: '+dur(S.cur)+' | Best: '+dur(S.best)+' | Smoke-free days: '+S.sf+'\nCigarettes avoided: '+S.avoided+' | Money saved: '+(S.money==null?'price not set':D.s.cur+S.money.toFixed(0))+'\n\nLast 7 days: '+JSON.stringify(a)+'\nLast 30 days: '+JSON.stringify(b)+'\nAchievements: '+achv().filter(x=>x.ok).map(x=>x.n).join('; ')+'\n'}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.type=='checkbox')return;const[a,x,y]=el.dataset.a.split(':');
 if(a=='tab'){tab=x;render();scrollTo(0,0)}else if(a=='sheet'){sheet=x;render()}else if(a=='close'){sheet=null;render()}
 else if(a=='del'){if(confirm('Delete this entry? This can’t be undone.')){D[x].splice(+y,1);save();render()}}
 else if(a=='export')dl('reclaim-backup-'+dk(Date.now())+'.json',JSON.stringify(D,null,1),'application/json');
 else if(a=='report')dl('reclaim-report-'+dk(Date.now())+'.txt',report(),'text/plain');
 else if(a=='import')$('#imp').click();
 else if(a=='wipe'){if(confirm('Delete ALL data on this device? Export a backup first.')&&confirm('Really delete everything?')){D=def();save();render()}}
 else if(a=='notif'){if(!('Notification'in window))return toast('Notifications aren’t supported in this browser.');Notification.requestPermission().then(p=>toast(p=='granted'?'Enabled while the app is open.':'Notifications not allowed.'))}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='imp'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o||o.v!==1||!o.s||!Array.isArray(o.cr)||!Array.isArray(o.lp)||!Array.isArray(o.nrt)||typeof o.hl!='object'||typeof o.sl!='object')throw 0;if(!confirm('Replace current data with this backup?'))return;D={...def(),...o,s:{...defS(),...o.s,rem:{...defS().rem,...o.s.rem}}};save();render();toast('Backup restored.')}catch(_){toast('That file isn’t a valid RECLAIM backup.')}});t.value='';return}
 if(t.dataset.a&&t.dataset.a.startsWith('ck:')){const td=dk(Date.now()),i=+t.dataset.a.slice(3),l=D.ck[td]||[];D.ck[td]=t.checked?[...new Set([...l,i])]:l.filter(x=>x!=i);save();return}
 if(t.dataset.s){const k=t.dataset.s;let v=t.value;
  if(k=='quit'){if(!v)return;v=new Date(v).toISOString()}
  if(k=='base'){v=parseInt(v);if(!(v>=1&&v<=100)){toast('Baseline must be 1–100.');return render()}}
  if(k=='pack'){v=parseInt(v);if(!(v>=1)){toast('Enter a valid pack size.');return render()}}
  if(k=='price'&&v!==''&&!(parseFloat(v)>=0)){toast('Enter a valid price.');return render()}
  D.s[k]=v;save();render();toast('Saved')}
 if(t.dataset.r){D.s.rem[t.dataset.r]=t.value;save()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f,v=Object.fromEntries(new FormData(f)),td=dk(Date.now());
 if(k=='craving'||k=='lapse'||k=='nrt'){const t=new Date(v.t).getTime();if(isNaN(t))return toast('Enter a valid time.');if(t>Date.now()+6e4)return toast('That time is in the future.');
  if(k=='craving'){D.cr.push({t,int:+v.int,trig:v.trig,did:v.did.trim(),smoked:v.smoked=='1',note:v.note.trim()});if(v.smoked=='1'){sheet=null;D.lp.push({t,n:1,note:'Logged with craving'});save();toast('Logged. Your progress is kept; resume right away.');return render()}}
  if(k=='lapse'){D.lp.push({t,n:+v.n,note:v.note.trim()});save();sheet=null;toast('Recorded. One lapse doesn’t undo your progress. Next step: finish today smoke-free.');return render()}
  if(k=='nrt')D.nrt.push({t,prod:v.prod.trim()||'Nicotine gum',str:v.str,n:+v.n,note:v.note.trim()})}
 if(k=='hlog'){const o={};['w','water','en','br','exM'].forEach(x=>{if(v[x]!=='')o[x]=+v[x]});o.exT=v.exT;o.nut=v.nut.trim();D.hl[td]=o}
 if(k=='slog'){const dd=sleepDur(v.bed,v.wake);if(dd>960&&!confirm('That’s over 16 hours of sleep. Is it correct?'))return;if(dd<120&&!confirm('That’s under 2 hours of sleep. Is it correct?'))return;D.sl[td]={bed:v.bed,wake:v.wake,q:+v.q,up:!!v.up,mex:!!v.mex};
  if(dd<420)toast('Saved · '+(dd/60).toFixed(1)+' h. A full night matters more than the early wake-up.');else if(mins(v.wake)<420)toast('Saved · '+(dd/60).toFixed(1)+' h and up before 7:00. Nicely done.');else toast('Saved · '+(dd/60).toFixed(1)+' h')}
 save();sheet=null;render();if(k!='slog')toast('Saved')});
setInterval(()=>{if(!sheet&&tab=='home')render();
 if(!('Notification'in window)||Notification.permission!='granted')return;const n=new Date(),t=pad(n.getHours())+':'+pad(n.getMinutes()),L={checkin:'Daily check-in time',nrt:'Log your nicotine gum',exercise:'Time to move',sleep:'Start winding down for bed',weekly:'Weekly progress review'};
 for(const k in D.s.rem){if(D.s.rem[k]===t&&fired[k]!=dk(n)+t&&(k!='weekly'||n.getDay()==0)){fired[k]=dk(n)+t;new Notification('RECLAIM',{body:L[k]})}}},30000);
render();
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
